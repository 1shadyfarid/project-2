*{

/* =========================
   TOP HEADER

/* =========================

========================= */

.wrap{

}

.card{

/* =========================

/* =========================

========================= */

.profile{

.avatar{

}

.avatar img{

    height:100%;

    display:block;
}

.info{
    flex:1;
}

.name{

}

.muted{

}

/* =========================
   BUTTONS
========================= */

.btn{

.btn:hover{

}

.red{

}

.red:hover{

}

.light{

   COMPOSER

.composer-title{

.input:focus,

}

.area{

.row{

.post{

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   FIRST LETTER AVATAR
===================================================== */

function initial(name) {

    const cleanName =
        (name || "؟").trim();

    return cleanName.charAt(0) || "؟";

}


/* =====================================================
   TIME
===================================================== */

function ago(timestamp) {

    const seconds =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    new Date(timestamp).getTime()
                ) / 1000
            )
        );

    if (seconds < 60) {
        return "الآن";
    }

    if (seconds < 3600) {

        return `منذ ${
            Math.floor(seconds / 60)
        } دقيقة`;

    }

    if (seconds < 86400) {

        return `منذ ${
            Math.floor(seconds / 3600)
        } ساعة`;

    }

    return new Date(timestamp)
        .toLocaleDateString("ar-EG");

}


/* =====================================================
   AVATAR
===================================================== */

function avatar(
    photo,
    name,
    className = "smallavatar"
) {

    if (photo) {

        return `
            <div class="${className}">
                <img
                    src="${escapeHTML(photo)}"
                    alt=""
                >
            </div>
        `;

    }

    return `
        <div class="${className}">
            ${escapeHTML(initial(name))}
        </div>
    `;

}


/* =====================================================
   ERROR
===================================================== */

function showError(message, error) {

    console.error(message, error);

    alert(
        message +
        (
            error?.message
                ? "\n\n" + error.message
                : ""
        )
    );

}


/* =====================================================
   AUTHENTICATION
===================================================== */

async function initAuth() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (session?.user) {

        currentUser =
            session.user;

        return true;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInAnonymously();


    if (error) {

        showError(
            "تعذر إنشاء جلسة المستخدم. تأكد من تفعيل Anonymous Sign-Ins في Supabase.",
            error
        );

        return false;

    }


    currentUser =
        data.user;

    return true;

}

/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin() {

    isAdmin = false;


    if (!currentUser) {

        updateAdminUI();

        return false;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("admins")
            .select("user_id")
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Admin check error:",
            error
        );

        isAdmin = false;

        updateAdminUI();

        return false;

    }


    isAdmin =
        !!data;


    console.log(
        "Admin status:",
        isAdmin
    );


    updateAdminUI();

    return isAdmin;

}

            "أدخل بريد حساب المدير:"
        );


    if (!email) {
        return;
    }


    const password =
        prompt(
            "أدخل كلمة مرور المدير:"
        );


    if (!password) {
        return;
    }


    await supabaseClient
        .auth
        .signOut();


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email: email.trim(),
                password: password
            });


    if (error) {

        await supabaseClient
            .auth
            .signInAnonymously();


        const {
            data: anonymousData
        } =
            await supabaseClient
                .auth
                .getUser();


        currentUser =
            anonymousData?.user || null;


        await checkAdmin();


        alert(
            "فشل تسجيل دخول المدير.\n\n" +
            error.message
        );

        return;

    }


    currentUser =
        data.user;


    const admin =
        await checkAdmin();


    if (!admin) {

        alert(
            "تم تسجيل الدخول، ولكن هذا الحساب ليس حساب مدير."
        );


        await supabaseClient
            .auth
            .signOut();


        const {
            data: anonymousData
        } =
            await supabaseClient
                .auth
                .signInAnonymously();


        currentUser =
            anonymousData?.user || null;


        await checkAdmin();

        return;

    }


    await loadProfile();

    await loadCommunity();


    alert(
        "تم تسجيل دخول المدير بنجاح 👑"
    );

}

/* =====================================================
   LOAD POSTS / COMMENTS / LIKES / PROFILES
===================================================== */

async function loadCommunity() {

    const [
        postsResult,
        commentsResult,
        likesResult,
        profilesResult,
        bannedUsersResult
    ] =
        await Promise.all([

            supabaseClient
                .from("posts")
                .select(
    "id,user_id,content,image_urls,created_at,is_pinned"
)
                .order("is_pinned", {
                    ascending: false
                })
                .order("created_at", {
                    ascending: false
                }),

            supabaseClient
                .from("comments")
                .select(
                    "id,post_id,user_id,content,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                ),

            supabaseClient
                .from("likes")
                .select(
                    "id,post_id,user_id,created_at"
                ),
supabaseClient
    .from("profiles")
    .select(
        "id,name,avatar_url,is_verified"
    ),

supabaseClient
    .from("banned_users")
    .select("user_id")

]);


    const error =
        postsResult.error ||
        commentsResult.error ||
        likesResult.error ||
        profilesResult.error;


    if (error) {

        showError(
            "تعذر تحميل المجتمع.",
            error
        );

        return;

    }


    /* =========================
       PROFILE MAP
    ========================= */

    const profileMap =
        new Map(
            (profilesResult.data || [])
                .map(
                    p => [
                        p.id,
                        p
                    ]
                )
        );


    /* =========================
       POSTS

       IMPORTANT:
       is_verified is copied from
       the user's profile into the post.
    ========================= */

    posts =
        (postsResult.data || [])
            .map(post => {

                const p =
                    profileMap.get(
                        post.user_id
                    );


                return {

                    ...post,

                    name:
                        p?.name ||
                        "عضو",

                    photo:
                        p?.avatar_url ||
                        null,

                    is_verified:
                        p?.is_verified === true

                };

            });


    /* =========================
       COMMENTS
    ========================= */

    comments =
        (commentsResult.data || [])
            .map(comment => {

                const p =
                    profileMap.get(
                        comment.user_id
                    );


                return {

                    ...comment,

                    name:
                        p?.name ||
                        "عضو",

                    photo:
                        p?.avatar_url ||
                        null,

                    is_verified:
                        p?.is_verified === true

                };

            });


    /* =========================
       LIKES
    ========================= */
likes =
    likesResult.data || [];

bannedUsers =
    (bannedUsersResult.data || [])
        .map(
            user => user.user_id
        );

render();
}

let selectedPostImages = [];


if ($("postImages")) {

    $("postImages").onchange = function (event) {

        if (!isAdmin) {

            alert("ليس لديك صلاحية.");

            event.target.value = "";

            return;
        }


        const files =
            Array.from(event.target.files);


        /* =========================
           MAXIMUM 2 IMAGES
        ========================= */

        if (files.length > 2) {

            alert(
                "يمكنك إضافة صورتين فقط."
            );

            event.target.value = "";

            selectedPostImages = [];

            renderSelectedPostImages();

            return;
        }


        /* =========================
           VALIDATE IMAGES
        ========================= */

        for (const file of files) {

            if (!file.type.startsWith("image/")) {

                alert(
                    "يرجى اختيار صور فقط."
                );

                event.target.value = "";

                selectedPostImages = [];

                renderSelectedPostImages();

                return;
            }


            if (file.size > 5 * 1024 * 1024) {

                alert(
                    "كل صورة يجب أن تكون أقل من 5MB."
                );

                event.target.value = "";

                selectedPostImages = [];

                renderSelectedPostImages();

                return;
            }
        }


        selectedPostImages = files;

        renderSelectedPostImages();

    };

}

/* =====================================================
   CREATE POST
===================================================== */

async function publish() {

    if (isBanned) {

        alert(
            "🚫 لا يمكنك نشر المنشورات لأن حسابك محظور."
        );

        return;
    }


    if (!profile?.name) {

        openModal();

        alert(
            "أنشئ ملفك الشخصي أولاً."
        );

        return;
    }


    const text =
        $("postText")
            .value
            .trim();


    if (!text) {

        alert(
            "اكتب محتوى المنشور."
        );

        return;
    }


    /* =========================
       ADMIN IMAGE CHECK
    ========================= */

    if (
        selectedPostImages.length > 0 &&
        !isAdmin
    ) {

        alert(
            "ليس لديك صلاحية إضافة الصور."
        );

        return;
    }


    if (
        selectedPostImages.length > 2
    ) {

        alert(
            "يمكنك إضافة صورتين فقط."
        );

        return;
    }


    /* =========================
       CREATE POST
    ========================= */

    const {
        data: post,
        error: postError
    } =
        await supabaseClient
            .from("posts")
            .insert({

                user_id:
                    currentUser.id,

                content:
                    text,

                image_urls:
                    []

            })
            .select()
            .single();


    if (postError) {

        showError(
            "تعذر نشر المنشور.",
            postError
        );

        return;
    }


    let uploadedPaths = [];


    /* =========================
       UPLOAD IMAGES
    ========================= */

    if (
        isAdmin &&
        selectedPostImages.length > 0
    ) {

        try {

            for (
                let i = 0;
                i < selectedPostImages.length;
                i++
            ) {

                const file =
                    selectedPostImages[i];


                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const filePath =
                    `${post.id}/${Date.now()}-${i}.${extension}`;


                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            "community-post-images"
                        )
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl:
                                    "3600",

                                upsert:
                                    false
                            }
                        );


                if (uploadError) {

                    throw uploadError;
                }


                uploadedPaths.push(
                    filePath
                );

            }


            /* =========================
               GET IMAGE URLS
            ========================= */

            const imageUrls =
                uploadedPaths.map(
                    path => {

                        const {
                            data
                        } =
                            supabaseClient
                                .storage
                                .from(
                                    "community-post-images"
                                )
                                .getPublicUrl(
                                    path
                                );

                        return data.publicUrl;
                    }
                );


            /* =========================
               SAVE IMAGE URLS
            ========================= */

            const {
                error: updateError
            } =
                await supabaseClient
                    .from("posts")
                    .update({

                        image_urls:
                            imageUrls

                    })
                    .eq(
                        "id",
                        post.id
                    );


            if (updateError) {

                throw updateError;
            }

        }

        catch (error) {

            console.error(
                "Image upload error:",
                error
            );


            /* =========================
               DELETE UPLOADED FILES
            ========================= */

            if (
                uploadedPaths.length > 0
            ) {

                await supabaseClient
                    .storage
                    .from(
                        "community-post-images"
                    )
                    .remove(
                        uploadedPaths
                    );
            }


            /* DELETE POST */

            await supabaseClient
                .from("posts")
                .delete()
                .eq(
                    "id",
                    post.id
                );


            showError(
                "تعذر رفع صور المنشور.",
                error
            );

            return;
        }
    }


    /* =========================
       RESET FORM
    ========================= */

    $("postText")
        .value = "";


    if ($("count")) {

        $("count")
            .textContent =
            "0 / 1000";
    }


    selectedPostImages = [];


    if ($("postImages")) {

        $("postImages")
            .value = "";
    }


    renderSelectedPostImages();


    await loadCommunity();

}
/* =====================================================
   LIKE
===================================================== */

async function likePost(postId) {

    if (!currentUser) {
        return;
    }


    const existing =
        likes.find(
            like =>
                like.post_id ===
                    postId
                &&
                like.user_id ===
                    currentUser.id
        );


    if (existing) {

        const {
            error
        } =
            await supabaseClient
                .from("likes")
                .delete()
                .eq(
                    "id",
                    existing.id
                );


        if (error) {

            showError(
                "تعذر إزالة الإعجاب.",
                error
            );

            return;

        }

    }

    else {

        const {
            error
        } =
            await supabaseClient
                .from("likes")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id

                });


        if (error) {

            showError(
                "تعذر إضافة الإعجاب.",
                error
            );

            return;

        }

    }


    await loadCommunity();

}

/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(
    postId
) {

    if (!currentUser) {
        return;
    }


    if (
        !confirm(
            "هل تريد حذف هذا المنشور؟"
        )
    ) {

        return;

    }


    /* =========================
       GET POST IMAGES FIRST
    ========================= */

    const {
        data: post,
        error: fetchError
    } =
        await supabaseClient
            .from("posts")
            .select(
                "id,user_id,image_urls"
            )
            .eq(
                "id",
                postId
            )
            .maybeSingle();


    if (fetchError) {

        showError(
            "تعذر العثور على المنشور.",
            fetchError
        );

        return;
    }


    if (!post) {

        alert(
            "المنشور غير موجود."
        );

        return;
    }


    /*
       Admin:
       Can delete any post.

       Normal user:
       Can delete only their own post.
    */

    if (
        !isAdmin &&
        post.user_id !== currentUser.id
    ) {

        alert(
            "لا تملك صلاحية حذف هذا المنشور."
        );

        return;
    }


    /* =========================
       DELETE IMAGES FROM STORAGE
    ========================= */

    if (
        Array.isArray(post.image_urls) &&
        post.image_urls.length > 0
    ) {

        const imagePaths =
            post.image_urls
                .map(url => {

                    /*
                       Extract the Storage path
                       from the public URL.
                    */

                    const marker =
                        "/storage/v1/object/public/community-post-images/";

                    const index =
                        url.indexOf(marker);


                    if (index === -1) {
                        return null;
                    }


                    return decodeURIComponent(
                        url.substring(
                            index + marker.length
                        )
                    );

                })
                .filter(Boolean);


        if (imagePaths.length > 0) {

            const {
                error: storageError
            } =
                await supabaseClient
                    .storage
                    .from(
                        "community-post-images"
                    )
                    .remove(
                        imagePaths
                    );


            if (storageError) {

                console.error(
                    "Storage delete error:",
                    storageError
                );

                alert(
                    "تعذر حذف صور المنشور من التخزين. لم يتم حذف المنشور."
                );

                return;
            }

        }

    }


    /* =========================
       DELETE POST
    ========================= */

    let query =
        supabaseClient
            .from("posts")
            .delete()
            .eq(
                "id",
                postId
            );


    if (!isAdmin) {

        query =
            query.eq(
                "user_id",
                currentUser.id
            );

    }


    const {
        data,
        error
    } =
        await query
            .select();


    if (error) {

        showError(
            "تعذر حذف المنشور.",
            error
        );

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        alert(
            "لم يتم حذف المنشور. قد لا تملك صلاحية حذفه."
        );

        return;

    }


    await loadCommunity();

}

/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const max =
                                400;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width > max ||
                                height > max
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            max /
                                            width
                                        );

                                    width =
                                        max;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            max /
                                            height
                                        );

                                    height =
                                        max;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.78
                                )
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

/* =====================================================

async function loadAdminStats() {

    if (!isAdmin) {
        return;
    }

    const [
        profilesResult,
        postsResult,
        commentsResult
    ] = await Promise.all([

        supabaseClient
            .from("profiles")
            .select("id,last_seen"),

        supabaseClient
            .from("posts")
            .select("id", { count: "exact", head: true }),

        supabaseClient
            .from("comments")
            .select("id", { count: "exact", head: true })

    ]);


    if (
        profilesResult.error ||
        postsResult.error ||
        commentsResult.error
    ) {

        console.error(
            "Admin statistics error:",
            profilesResult.error ||
            postsResult.error ||
            commentsResult.error
        );

        return;
    }


    const profiles =
        profilesResult.data || [];


    /*
       Active = seen within the last 5 minutes
    */

    const fiveMinutesAgo =
        Date.now() -
        (5 * 60 * 1000);


    const activeMembers =
        profiles.filter(profile => {

            if (!profile.last_seen) {
                return false;
            }

            return (
                new Date(
                    profile.last_seen
                ).getTime() >= fiveMinutesAgo
            );

        }).length;


    if ($("totalMembers")) {

        $("totalMembers")
            .textContent =
            profiles.length;

    }


    if ($("activeMembers")) {

        $("activeMembers")
            .textContent =
            activeMembers;

    }


    if ($("totalPosts")) {

        $("totalPosts")
            .textContent =
            postsResult.count || 0;

    }


    if ($("totalComments")) {

        $("totalComments")
            .textContent =
            commentsResult.count || 0;

    }


    if ($("adminStats")) {

        $("adminStats").style.display =
            "block";

    }

}

async function enableNotifications() {

    if (!("Notification" in window)) {

        alert(
            "متصفحك لا يدعم الإشعارات."
        );

        return;

    }


    if (!("serviceWorker" in navigator)) {

        alert(
            "متصفحك لا يدعم إشعارات الخلفية."
        );

        return;

    }


    const permission =
        await Notification.requestPermission();


    if (permission === "granted") {

        alert(
            "🔔 تم تفعيل الإشعارات بنجاح."
        );

    }

    else if (permission === "denied") {

        alert(
            "تم رفض الإشعارات. يمكنك تفعيلها من إعدادات المتصفح."
        );

    }

}

/* =====================================================

===================================================== */

async function registerNotificationWorker() {

    if (!("serviceWorker" in navigator)) {

        console.log(
            "Service Workers are not supported."
        );

        return null;

    }


    try {

        const registration =
            await navigator.serviceWorker.register(
                "/sw.js"
            );


        console.log(
            "🔔 Notification Service Worker registered:",
            registration
        );


        return registration;

    }

    catch (error) {

        console.error(
            "❌ Service Worker registration failed:",
            error
        );

        return null;

    }

}
